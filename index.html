<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Аноним-чат</title>
<style>
  :root{--bg:#0f1117;--panel:#181b24;--line:#272b38;--text:#e8eaf0;--muted:#8a91a5;--accent:#6c8cff;--me:#2c3a73;--them:#232736;--danger:#ff6b6b}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .wrap{max-width:720px;height:100%;margin:0 auto;display:flex;flex-direction:column;padding:12px}
  header{display:flex;align-items:center;justify-content:space-between;padding:8px 4px}
  h1{font-size:18px;margin:0}
  #status{color:var(--muted);font-size:14px}
  #log{flex:1;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
  .m{max-width:80%;padding:8px 12px;border-radius:14px;white-space:pre-wrap;word-break:break-word}
  .me{align-self:flex-end;background:var(--me)}
  .them{align-self:flex-start;background:var(--them)}
  .sys{align-self:center;color:var(--muted);font-size:13px;text-align:center}
  #typing{height:20px;color:var(--muted);font-size:13px;padding:2px 6px}
  form{display:flex;gap:8px}
  input[type=text]{flex:1;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:16px}
  button{padding:12px 16px;border-radius:12px;border:0;background:var(--accent);color:#fff;font-size:15px;cursor:pointer}
  button.ghost{background:var(--panel);border:1px solid var(--line);color:var(--text)}
  button.danger{background:transparent;border:1px solid var(--danger);color:var(--danger)}
  button:disabled,input:disabled{opacity:.45;cursor:not-allowed}
  .row{display:flex;gap:8px;margin:8px 0}
  .row button{flex:1}
  #gate{max-width:420px;margin:15vh auto;padding:20px;background:var(--panel);border:1px solid var(--line);border-radius:16px}
  #gate label{display:flex;gap:10px;align-items:flex-start;margin:14px 0;color:var(--muted);font-size:14px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div id="gate">
  <h1>Аноним-чат</h1>
  <p style="color:var(--muted)">Текстовый чат со случайным собеседником. Никаких аккаунтов, переписка не сохраняется.</p>
  <label><input type="checkbox" id="age"> <span>Мне есть 18 лет, и я согласен(на) не присылать оскорбления, угрозы, спам и запрещённый контент. Нарушителей можно блокировать жалобой.</span></label>
  <button id="enter" disabled style="width:100%">Войти</button>
</div>

<div class="wrap" id="app" hidden>
  <header><h1>Аноним-чат</h1><span id="status">…</span></header>
  <div id="log"></div>
  <div id="typing"></div>
  <div class="row">
    <button id="find">Найти собеседника</button>
    <button id="leave" class="ghost" disabled>Завершить</button>
    <button id="report" class="danger" disabled>Пожаловаться</button>
  </div>
  <form id="form">
    <input type="text" id="text" maxlength="500" autocomplete="off" placeholder="Сообщение…" disabled>
    <button id="sendBtn" disabled>Отправить</button>
  </form>
</div>

<script>
const $ = id => document.getElementById(id);
let sid = null, mode = 'idle', epoch = 0, typingTimer = null, lastTypingSent = 0;

$('age').onchange = () => $('enter').disabled = !$('age').checked;
$('enter').onclick = async () => {
  $('gate').hidden = true; $('app').hidden = false;
  await join();
  await api('/api/find');
};

async function api(path, body) {
  const r = await fetch(path + '?id=' + sid, {method: 'POST', body: body ?? '', headers: {'Content-Type': 'text/plain; charset=utf-8'}});
  let j = {}; try { j = await r.json(); } catch {}
  if (r.status === 404) { await join(); }
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}

async function join() {
  const r = await fetch('/api/join', {method: 'POST'});
  const j = await r.json();
  if (!r.ok) { sys(j.error || 'Не удалось войти'); setMode('banned'); throw new Error(j.error); }
  sid = j.id; setMode('idle');
  poll(++epoch);
}

async function poll(my) {
  while (my === epoch) {
    try {
      const r = await fetch('/api/events?id=' + sid);
      if (my !== epoch) return;
      if (r.status === 404) { sys('Сессия истекла, подключаемся заново…'); await join(); return; }
      (await r.json()).forEach(handle);
    } catch { await new Promise(r => setTimeout(r, 2000)); }
  }
}

function handle(e) {
  if (e.t === 'waiting') { setMode('waiting'); sys('Ищем собеседника…'); }
  else if (e.t === 'matched') { $('log').innerHTML = ''; setMode('chat'); sys('Собеседник найден. Поздоровайтесь!'); }
  else if (e.t === 'msg') { add('them', e.text); $('typing').textContent = ''; }
  else if (e.t === 'typing') { $('typing').textContent = 'Собеседник печатает…'; clearTimeout(typingTimer); typingTimer = setTimeout(() => $('typing').textContent = '', 3000); }
  else if (e.t === 'left') { sys('Собеседник завершил чат.'); setMode('ended'); $('typing').textContent = ''; }
  else if (e.t === 'banned') { sys('Вы заблокированы по жалобам пользователей.'); setMode('banned'); }
}

function setMode(m) {
  mode = m;
  const chat = m === 'chat';
  $('text').disabled = $('sendBtn').disabled = !chat;
  $('leave').disabled = !(chat || m === 'waiting');
  $('report').disabled = !(chat || m === 'ended');
  $('find').disabled = chat || m === 'waiting' || m === 'banned';
  $('status').textContent = {idle: 'не в чате', waiting: 'поиск…', chat: 'в чате', ended: 'чат завершён', banned: 'блокировка'}[m];
  if (chat) $('text').focus();
}

function add(cls, text) {
  const d = document.createElement('div');
  d.className = 'm ' + cls; d.textContent = text;
  $('log').appendChild(d); $('log').scrollTop = 1e9;
}
function sys(text) { const d = document.createElement('div'); d.className = 'sys'; d.textContent = text; $('log').appendChild(d); $('log').scrollTop = 1e9; }

$('find').onclick = () => api('/api/find').catch(e => sys(e.message));
$('leave').onclick = async () => { try { await api('/api/leave'); sys('Вы завершили чат.'); setMode('ended'); } catch (e) { sys(e.message); } };
$('report').onclick = async () => {
  if (!confirm('Пожаловаться на собеседника? Чат будет завершён.')) return;
  try { await api('/api/report'); await api('/api/leave'); sys('Жалоба отправлена. Спасибо!'); setMode('ended'); } catch (e) { sys(e.message); }
};
$('form').onsubmit = async ev => {
  ev.preventDefault();
  const t = $('text').value.trim();
  if (!t || mode !== 'chat') return;
  try { await api('/api/send', t); add('me', t); $('text').value = ''; } catch (e) { sys(e.message); }
};
$('text').oninput = () => {
  const now = Date.now();
  if (mode === 'chat' && now - lastTypingSent > 2000) { lastTypingSent = now; api('/api/typing').catch(() => {}); }
};
</script>
</body>
</html>
